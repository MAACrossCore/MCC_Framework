name: install

env:
  # 版本控制：
  # - 设置 VERSION 为空字符串时，下载 latest 版本
  # - 设置 VERSION 为具体版本号时（如 v1.2.3），下载指定版本
  MAAFW_VERSION: ""
  # UI patches under ui_custom/MFAAvalonia target this exact release.
  MFAA_VERSION: "v2.15.2"

on:
  # 练习/日常开发不自动打包，避免 artifact 配额被打满。
  # 需要发版时：打 v* tag，或在 Actions 里手动 Run workflow。
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          # 检查标签格式
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          # 检查是否为预发布版本
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
            echo "This is a pre-release version"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  install:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [win, macos, linux, android]
        arch: [aarch64, x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os }}-${{ matrix.arch }}*"
          latest: ${{ env.MAAFW_VERSION == '' }}
          tag: ${{ env.MAAFW_VERSION }}
          out-file-path: "deps"
          extract: true

      - name: Download MFAAvalonia
        if: matrix.os != 'android'
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: SweetSmellFox/MFAAvalonia
          fileName: "MFAAvalonia-*-${{ (matrix.os == 'win' && 'win') || (matrix.os == 'macos' && 'osx') || (matrix.os == 'linux' && 'linux') }}-${{ (matrix.arch == 'x86_64' && 'x64') || (matrix.arch == 'aarch64' && 'arm64') }}*"
          latest: ${{ env.MFAA_VERSION == '' }}
          tag: ${{ env.MFAA_VERSION }}
          out-file-path: "MFA"
          extract: true

      - name: Clean up MFAAvalonia archive
        if: matrix.os != 'android'
        shell: bash
        run: |
          ARCHIVE_FILE_PATH="${{ fromJson(steps.download_mfa.outputs.downloaded_files)[0] }}"
          rm -f "${ARCHIVE_FILE_PATH}"
          echo "Archive cleanup command executed for MFAAvalonia."

      - name: Remove built-in runtime in MFA
        if: matrix.os != 'android'
        shell: bash
        run: |
          rm -rf MFA/runtimes
      
      - name: Prepare embedded Python
        if: matrix.os == 'win' || matrix.os == 'macos'
        shell: bash
        run: |
          python tools/ci/setup_embed_python.py --target-os ${{ matrix.os }} --target-arch ${{ matrix.arch }}

      - name: Download agent dependency wheels
        if: matrix.os != 'android'
        shell: bash
        run: |
          python tools/ci/download_deps.py \
            --deps-dir install/deps \
            --target-os ${{ matrix.os }} \
            --target-arch ${{ matrix.arch }}

      - name: Install
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" != "android" ]]; then
            if [ -d "MFA" ]; then
              echo "Copying MFA files to install directory..."
              mkdir -p install
              rsync -av --ignore-existing MFA/ install/
              echo "MFA files copied successfully."
            else
              echo "MFA directory not found, skipping copy."
            fi
          else
            echo "Skipping copy MFA for Android."
          fi

          cd tools/
          python -m pip install -r ./requirements.txt
          python ./install.py ${{ needs.meta.outputs.tag }} ${{ matrix.os }} ${{ matrix.arch }}
          cd ..

      - name: Set up .NET for customized MFAAvalonia core
        if: matrix.os != 'android'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and install customized MFAAvalonia core
        if: matrix.os != 'android'
        shell: bash
        run: |
          git clone https://github.com/SweetSmellFox/MFAAvalonia.git .tmp/MFAAvalonia-src
          git -C .tmp/MFAAvalonia-src checkout 6065fe33798b72906c5079fa6f210646801d9a5c
          git -C .tmp/MFAAvalonia-src apply "$GITHUB_WORKSPACE/ui_custom/MFAAvalonia/laa-chip-filter.patch"
          git -C .tmp/MFAAvalonia-src apply "$GITHUB_WORKSPACE/ui_custom/MFAAvalonia/laa-chip-filter-total-level.patch"
          git -C .tmp/MFAAvalonia-src apply "$GITHUB_WORKSPACE/ui_custom/MFAAvalonia/laa-chip-task-checkbox.patch"
          git -C .tmp/MFAAvalonia-src apply "$GITHUB_WORKSPACE/ui_custom/MFAAvalonia/laa-pretask-path-resolution.patch"
          git -C .tmp/MFAAvalonia-src apply "$GITHUB_WORKSPACE/ui_custom/MFAAvalonia/laa-stop-on-task-failure.patch"
          git -C .tmp/MFAAvalonia-src apply "$GITHUB_WORKSPACE/ui_custom/MFAAvalonia/laa-no-autostart.patch"
          git -C .tmp/MFAAvalonia-src apply "$GITHUB_WORKSPACE/ui_custom/MFAAvalonia/laa-simplified-settings.patch"
          git -C .tmp/MFAAvalonia-src apply "$GITHUB_WORKSPACE/ui_custom/MFAAvalonia/laa-project-profiles-scheduler.patch"

          case "${{ matrix.os }}-${{ matrix.arch }}" in
            win-x86_64) rid=win-x64 ;;
            win-aarch64) rid=win-arm64 ;;
            macos-x86_64) rid=osx-x64 ;;
            macos-aarch64) rid=osx-arm64 ;;
            linux-x86_64) rid=linux-x64 ;;
            linux-aarch64) rid=linux-arm64 ;;
            *) echo "Unsupported MFA runtime"; exit 1 ;;
          esac

          dotnet restore .tmp/MFAAvalonia-src/MFAAvalonia.Desktop/MFAAvalonia.Desktop.csproj -r "$rid"
          dotnet build .tmp/MFAAvalonia-src/MFAAvalonia.Desktop/MFAAvalonia.Desktop.csproj -c Release -r "$rid" --no-restore
          cp .tmp/MFAAvalonia-src/bin/AnyCPU/Release/MFAAvalonia.Core.dll install/libs/MFAAvalonia.Core.dll

      - uses: actions/upload-artifact@v4
        with:
          name: MaaXXX-${{ matrix.os }}-${{ matrix.arch }}
          path: "install"

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          # 正式版：使用 tag-pattern 只匹配正式版标签，包含所有从上一个正式版以来的提交
          # 预发布版：正常生成，只包含从上一个标签以来的提交
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, install, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - run: |
          cd assets
          for f in *; do
            (cd $f && zip -r ../$f-${{ needs.meta.outputs.tag }}.zip .)
          done
          
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

        # Mirror酱为第三方分发服务，新项目默认关闭
        # 若有需要请联系 Mirror酱 开通，直接自行开启是无法使用的
        # https://mirrorchyan.com/
      - name: Trigger MirrorChyanUploading
        if: false
        # if: ${{ github.repository_owner == 'MaaXYZ' }}
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
